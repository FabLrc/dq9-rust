[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FabLrc/dq9-online"

[workspace.dependencies]
nds-rom = { path = "crates/nds-rom" }
anyhow = "1"
dq9-audio = { path = "crates/dq9-audio" }
dq9-core = { path = "crates/dq9-core" }
dq9-formats = { path = "crates/dq9-formats" }
testrom = { path = "crates/testrom" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dq9-render = { path = "crates/dq9-render" }
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies are rarely debugged; optimize them so tools stay fast on a 256 MiB ROM.
opt-level = 3

[profile.dev.package.dq9-audio]
# The mixer runs in a real-time callback: keep it fast in debug builds too.
opt-level = 3

[profile.test]
# Real-ROM tests walk ~270k strings and 53k archive members; unoptimized they take minutes.
opt-level = 2
