[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiroc/dq9-online"

[workspace.dependencies]
nds-rom = { path = "crates/nds-rom" }
anyhow = "1"
dq9-formats = { path = "crates/dq9-formats" }
testrom = { path = "crates/testrom" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies are rarely debugged; optimize them so tools stay fast on a 256 MiB ROM.
opt-level = 3
