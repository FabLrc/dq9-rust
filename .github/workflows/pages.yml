name: GitHub Pages

on:
  # Only paths that can change the browser binary (and this workflow) redeploy the site;
  # documentation commits no longer rebuild and publish it. `workflow_dispatch` stays
  # available for an explicit deployment.
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Only the default branch may publish the site; a manual run on a branch must not deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-release
      - name: Build the browser application
        run: cargo build --locked -p dq9-app --release --target wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Assemble the static site (no game data)
        run: |
          mkdir -p _site/pkg
          cp crates/dq9-app/web/index.html _site/index.html
          wasm-bindgen --target web --no-typescript \
            --out-dir _site/pkg target/wasm32-unknown-unknown/release/dq9-app.wasm
      - name: Verify the artifact is only the page and its wasm-bindgen output
        shell: bash
        run: |
          set -euo pipefail
          # Whitelist: index.html and the JavaScript/WebAssembly bindings. A ROM, save, capture
          # or any other file in _site fails the job instead of being published.
          unexpected=$(find _site -type f \
            ! -name index.html \
            ! -path '_site/pkg/*.js' \
            ! -path '_site/pkg/*.wasm')
          if [ -n "$unexpected" ]; then
            echo "unexpected files in the Pages artifact:"
            echo "$unexpected"
            exit 1
          fi
          test -s _site/index.html
          test -s _site/pkg/dq9-app.js
          test -s _site/pkg/dq9-app_bg.wasm
          find _site -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
