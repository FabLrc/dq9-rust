name: CI

# Every job calls scripts/verify.ps1, the single source of the verification commands, so CI
# and the local loop run exactly the same cargo invocations. `shell: pwsh` (not `pwsh -File`)
# lets `-Only fmt,clippy` reach the script as an array.

on:
  # Documentation and reverse-engineering notes do not change the binaries: skipping them
  # keeps the Linux jobs from rerunning on doc-only commits. `re/**` is not ignored as a
  # whole: `re/functions.txt` feeds the `port:` markers that the coverage job checks.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 're/symbols.txt'
      - 're/ghidra_scripts/**'
      - 'rom/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 're/symbols.txt'
      - 're/ghidra_scripts/**'
      - 'rom/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # cpal's alsa-sys needs alsa.pc; the runner image does not ship it.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: ./scripts/verify.ps1 -Only fmt,clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # cpal's alsa-sys needs alsa.pc; the runner image does not ship it.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # The ROM is never available in CI; real-ROM tests skip themselves.
      - shell: pwsh
        run: ./scripts/verify.ps1 -Only test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Platform-independent crates and the app must keep building for the web target.
      - shell: pwsh
        run: ./scripts/verify.ps1 -Only wasm

  # Porting progress (`cargo dq9re coverage`, no ROM needed): checks the `port:` markers,
  # shows the result in the job summary and fails when the README block committed with the
  # change is stale. CI never commits: the block is refreshed locally by verify.ps1.
  coverage:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: ./scripts/verify.ps1 -Only coverage | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Check the README progress block
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::error file=README.md::bloc d'avancement périmé : lancer scripts/verify.ps1 en local et commiter README.md"
            exit 1
          fi
